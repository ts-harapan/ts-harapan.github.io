<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sea mining risk simulation for Ujung Kulon</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f0e;color:#e8ece9;font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
.card{width:100%;max-width:380px;background:#121816;border:1px solid #24302c;border-radius:14px;padding:28px}
h1{font:600 20px/1.3 inherit;margin:0 0 6px}
p{margin:0 0 18px;color:#a7b3ae;font-size:14px}
label{display:block;font-size:13px;color:#a7b3ae;margin-bottom:6px}
input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #2e3b36;background:#0b0f0e;color:#e8ece9;font-size:16px}
input:focus{outline:2px solid #e07a3f;outline-offset:1px}
button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:999px;background:#e07a3f;color:#111;font-weight:600;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:#ff8a80;font-size:13px;min-height:20px;margin-top:10px}
a{color:#a7b3ae;font-size:13px}
</style></head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Sea mining risk simulation</h1>
  <p>This page is private. Enter the password to open it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" required autofocus>
  <button id="go" type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
  <a href="../">← Back to main page</a>
</form>
<script>
const SALT='MVDBQbMjcQIe5uAqQ6L0Rg==',ITER=250000,ASSETS={"mapdata": ["mapdata.json", "application/json"], "depth": ["depth.json", "application/json"], "currents": ["currents.json", "application/json"], "sat": ["sat.jpg", "image/jpeg"], "rhino": ["rhino.png", "image/png"], "dugong": ["dugong-map.png", "image/png"]};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function dec(key,name){const r=await fetch(name+'.txt',{cache:'no-cache'});if(!r.ok)throw new Error('missing '+name);const b=b64((await r.text()).trim());
 return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12))}
async function unlock(pw){const key=await keyFor(pw);
 const page=new TextDecoder().decode(await dec(key,'page'));
 let html=page;
 await Promise.all(Object.entries(ASSETS).map(async([k,[file,type]])=>{const buf=await dec(key,k);const url=URL.createObjectURL(new Blob([buf],{type}));
  html=html.split("'"+file+"'").join("'"+url+"'").split('"'+file+'"').join('"'+url+'"')}));
 try{sessionStorage.setItem('minePw',pw)}catch(e){}
 document.open();document.write(html);document.close()}
const f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();go.disabled=true;err.textContent='';go.textContent='Opening…';
 try{await unlock(document.getElementById('pw').value)}catch(x){go.disabled=false;go.textContent='Open';
  err.textContent=x&&x.name==='OperationError'?'Wrong password. Please try again.':'Could not open the page ('+(x&&x.message||x)+').'}});
(async()=>{let pw=null;try{pw=sessionStorage.getItem('minePw')}catch(e){}if(pw){try{await unlock(pw)}catch(e){try{sessionStorage.removeItem('minePw')}catch(_){}}}})();
</script>
</body></html>
